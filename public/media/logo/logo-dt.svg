<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="techGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1"/>
    </pattern>

    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/> <feComponentTransfer>
         <feFuncA type="linear" slope="0.05"/> </feComponentTransfer>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#09090b"/>
  
  <rect width="1200" height="1200" fill="url(#techGrid)" opacity="0.6"/>

  <rect width="1200" height="1200" filter="url(#noise)" opacity="0.5"/>

  <g transform="translate(600, 520)" text-anchor="middle">
    
    <g transform="translate(-160, -220) scale(6.5)">
       <path fill="#000" fill-opacity="0.5" transform="translate(4,4)"
        d="M8 8H32L56 32V32L32 56H8V8ZM16 16V48H28L44 32L28 16H16Z M64 8H80L88 16H64V8Z M72 16H80V48L72 56V16Z"
       />
       <path fill="#ffffff" filter="url(#glow)"
        d="M8 8H32L56 32V32L32 56H8V8ZM16 16V48H28L44 32L28 16H16Z"
       />
       <path fill="#ffffff" filter="url(#glow)"
        d="M64 8H80L88 16H64V8Z" 
       />
       <path fill="#ffffff" filter="url(#glow)"
        d="M72 16H80V48L72 56V16Z" 
       />
    </g>

    <g transform="translate(0, 240)">
        <text x="0" y="0" fill="white" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="80" letter-spacing="4">
            DORIAN THOMÉ
        </text>
        
        <line x1="-100" y1="40" x2="100" y2="40" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>

        <text x="0" y="110" fill="#a1a1aa" font-family="monospace" font-weight="500" font-size="42" letter-spacing="2">
            WEB ENGINEERING | AI
        </text>
    </g>
  </g>
</svg>